quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://db-postgres:5432/postgres

quarkus.flyway.migrate-at-start=true

quarkus.console.color=true

# -e QUARKUS_CONFIG_LOCATIONS=/path/to/file  to add config file with secret from podman, go see podman docs